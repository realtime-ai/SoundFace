<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>SoundFace 管理后台</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- Login -->
  <main id="login-view" class="login" hidden>
    <form id="login-form" class="card login-card" autocomplete="on">
      <h1>SoundFace 管理后台</h1>
      <p class="muted">用名单上的邮箱登录，和应用里一样收验证码。</p>
      <label>邮箱<input id="login-email" type="email" name="email" required placeholder="name@example.com" autocomplete="email"></label>
      <div class="row">
        <label class="grow">验证码<input id="login-code" inputmode="numeric" maxlength="6" placeholder="6 位数字" autocomplete="one-time-code"></label>
        <button type="button" id="login-send" class="secondary">获取验证码</button>
      </div>
      <button type="submit" id="login-submit">登录</button>
      <p id="login-message" class="message" role="status"></p>
    </form>
  </main>

  <!-- Console -->
  <div id="app-view" class="shell" hidden>
    <nav class="nav">
      <div class="brand">SoundFace 后台</div>
      <a href="#/" data-nav="overview">概览</a>
      <a href="#/codes" data-nav="codes">兑换码</a>
      <a href="#/users" data-nav="users">用户</a>
      <a href="#/usage" data-nav="usage">使用统计</a>
      <a href="#/audit" data-nav="audit">操作记录</a>
      <div class="who"><span id="who"></span><button type="button" id="logout" class="link">退出</button></div>
    </nav>
    <main id="page" class="page"></main>
  </div>

  <dialog id="confirm" class="card">
    <form method="dialog">
      <h3 id="confirm-title"></h3>
      <p id="confirm-text"></p>
      <div class="row end">
        <button value="cancel" class="secondary" id="confirm-cancel">取消</button>
        <button value="ok" id="confirm-ok">确定</button>
      </div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="./app.js" type="module"></script>
</body>
</html>
